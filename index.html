<button id="pwa-install-btn" type="button" aria-label="Install app" hidden
  style="position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:20px;z-index:9999;background:#6366F1;color:#fff;padding:10px 18px;border-radius:999px;border:none;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 8px 24px rgba(99,102,241,.4)">
  Install app
</button>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(console.error));
  }
  const btn = document.getElementById('pwa-install-btn');
  const installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let deferred;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    if (!installed) btn.hidden = false;
  });
  btn.addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice;
    deferred = null; btn.hidden = true;
  });
  window.addEventListener('appinstalled', () => { btn.hidden = true; });
</script>
